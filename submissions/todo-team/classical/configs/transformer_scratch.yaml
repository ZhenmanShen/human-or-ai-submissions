# C3: 4-layer Transformer encoder (d=256, 4 heads), byte-level BPE (12k) trained on train + unlabeled text,
# random init. Early stopping on a stratified 10% inner split of the training rows (never the 2k val).
# No grid search (one GPU run is ~minutes, a 5-fold grid would be hours); the architecture is fixed up front.
model: transformer_scratch
params:
  vocab_size: 12000
  max_len: 512
  d_model: 256
  n_heads: 4
  n_layers: 4
  d_ff: 1024
  dropout: 0.1
  lr: 3.0e-4
  weight_decay: 0.01
  batch_size: 32
  max_epochs: 20
  patience: 3
  warmup_frac: 0.06
  inner_val_frac: 0.1
