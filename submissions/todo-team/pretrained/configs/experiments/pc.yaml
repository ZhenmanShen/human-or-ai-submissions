# Full benchmark for the desktop (Ryzen 5 9600X, 32 GB RAM, RTX 5070 12 GB + RTX 3060 12 GB).
#   python run_all.py --profile pc
# GPU jobs are spread over both GPUs (heaviest first, so the long DeBERTa-large run
# starts immediately); CPU jobs run alongside on a CPU worker.
# `cost` ~ minutes on the RTX 5070 (a guess - the first session's report shows real times).
# Rough wall time: 6-9 h (overnight). Faster options:
#   --set cv.n_folds=3                                  (~40% less)
#   --skip ft_deberta_v3_large,ft_openai_detector_large,debiased_deberta_v3_base   (~3 h less)
description: Every model, 5-fold stratified CV, plus learning-curve, semi-supervised and robustness experiments.

defaults:                     # applied to every job (a job's own `set` wins)
  cv.scheme: stratified
  cv.n_folds: 5

jobs:
  # ------------------------------------------------------------ classical (CPU)
  - {name: tfidf_logreg,        config: tfidf_logreg,        resource: cpu, cost: 8}
  - {name: tfidf_nb,            config: tfidf_nb,            resource: cpu, cost: 5}
  - {name: tfidf_svm,           config: tfidf_svm,           resource: cpu, cost: 8}
  - {name: stylometric_gbm,     config: stylometric_gbm,     resource: cpu, cost: 4}
  - {name: stylometric_gbm_ext, config: stylometric_gbm_ext, resource: cpu, cost: 6}

  # ------------------------------------------------------------ pretrained LM features (GPU)
  - {name: lm_gpt2,                     config: lm_gpt2,                     resource: gpu, cost: 8}
  - {name: lm_gpt2_medium,              config: lm_gpt2_medium,              resource: gpu, cost: 15}
  - {name: binoculars_qwen05b,          config: binoculars_qwen05b,          resource: gpu, cost: 15}
  - {name: binoculars_qwen15b,          config: binoculars_qwen15b,          resource: gpu, cost: 35}
  - {name: binoculars_qwen15b_zeroshot, config: binoculars_qwen15b_zeroshot, resource: gpu, cost: 2, after: binoculars_qwen15b}
  - {name: embed_bge_base,              config: embed_bge_base,              resource: gpu, cost: 6}
  - {name: embed_e5_base,               config: embed_e5_base,               resource: gpu, cost: 6}

  # ------------------------------------------------------------ fine-tuned encoders (GPU)
  - {name: ft_distilroberta,         config: ft_distilroberta,         resource: gpu, cost: 20}
  - {name: ft_roberta_base,          config: ft_roberta_base,          resource: gpu, cost: 40}
  - {name: ft_openai_detector,       config: ft_openai_detector,       resource: gpu, cost: 40}
  - {name: ft_electra_base,          config: ft_electra_base,          resource: gpu, cost: 40}
  - {name: ft_modernbert_base,       config: ft_modernbert_base,       resource: gpu, cost: 40}
  - {name: ft_deberta_v3_small,      config: ft_deberta_v3_small,      resource: gpu, cost: 35}
  - {name: ft_deberta_v3_base,       config: ft_deberta_v3_base,       resource: gpu, cost: 70}
  - {name: ft_deberta_v3_large,      config: ft_deberta_v3_large,      resource: gpu, cost: 180}
  - {name: ft_openai_detector_large, config: ft_openai_detector_large, resource: gpu, cost: 150}

  # ------------------------------------------------------------ learning curves (rubric: effect of training size)
  - {name: lc_tfidf_logreg_f010, config: tfidf_logreg, resource: cpu, cost: 2, group: learning_curve, set: {data.train_frac: 0.10}}
  - {name: lc_tfidf_logreg_f025, config: tfidf_logreg, resource: cpu, cost: 3, group: learning_curve, set: {data.train_frac: 0.25}}
  - {name: lc_tfidf_logreg_f050, config: tfidf_logreg, resource: cpu, cost: 5, group: learning_curve, set: {data.train_frac: 0.50}}
  - {name: lc_stylo_ext_f010, config: stylometric_gbm_ext, resource: cpu, cost: 2, group: learning_curve, set: {data.train_frac: 0.10}}
  - {name: lc_stylo_ext_f025, config: stylometric_gbm_ext, resource: cpu, cost: 3, group: learning_curve, set: {data.train_frac: 0.25}}
  - {name: lc_stylo_ext_f050, config: stylometric_gbm_ext, resource: cpu, cost: 4, group: learning_curve, set: {data.train_frac: 0.50}}
  - {name: lc_deberta_v3_small_f025, config: ft_deberta_v3_small, resource: gpu, cost: 12, group: learning_curve, set: {data.train_frac: 0.25}}

  # ------------------------------------------------------------ unlabeled data (rubric: semi-supervised)
  - {name: ss_tfidf_logreg, config: tfidf_logreg, resource: cpu, cost: 12, group: semi_supervised,
     set: {semi_supervised.enabled: true, semi_supervised.pool: [unlabeled]}}
  - {name: ss_stylo_ext,    config: stylometric_gbm_ext, resource: cpu, cost: 8, group: semi_supervised,
     set: {semi_supervised.enabled: true, semi_supervised.pool: [unlabeled]}}
  - {name: ss_stylo_ext_with_test, config: stylometric_gbm_ext, resource: cpu, cost: 8, group: semi_supervised,
     set: {semi_supervised.enabled: true, "semi_supervised.pool": [unlabeled, test]}}

  # ------------------------------------------------------------ robustness / generalisation (rubric: error analysis)
  - {name: cluster_tfidf_logreg, config: tfidf_logreg, resource: cpu, cost: 8, group: robustness, set: {cv.scheme: cluster}}
  - {name: cluster_stylo_ext,    config: stylometric_gbm_ext, resource: cpu, cost: 6, group: robustness, set: {cv.scheme: cluster}}
  - {name: debiased_stylo_ext,   config: stylometric_gbm_ext, resource: cpu, cost: 6, group: robustness,
     set: {preprocessing.collapse_blank_lines: true, preprocessing.collapse_spaces: true,
           preprocessing.normalize_quotes: true, preprocessing.remove_zero_width: true, preprocessing.map_homoglyphs: true}}
  - {name: debiased_deberta_v3_base, config: ft_deberta_v3_base, resource: gpu, cost: 70, group: robustness,
     set: {preprocessing.collapse_blank_lines: true, preprocessing.collapse_spaces: true,
           preprocessing.normalize_quotes: true, preprocessing.remove_zero_width: true, preprocessing.map_homoglyphs: true}}

report:
  ensemble_groups: [main]     # which job groups may enter the automatic ensembles
