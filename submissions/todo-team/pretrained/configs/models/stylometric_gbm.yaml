# Hand-crafted style features -> trees. estimator: lightgbm | random_forest | hist_gb
model:
  name: stylometric_gbm
  params:
    estimator: lightgbm
    svd_components: 0      # >0 appends an SVD of char TF-IDF (content signal)
    lgbm:
      n_estimators: 600
      learning_rate: 0.03
      num_leaves: 31
      min_child_samples: 20
      reg_lambda: 1.0
    random_forest:
      n_estimators: 500
      min_samples_leaf: 2
    hist_gb:
      max_iter: 500
      learning_rate: 0.05
