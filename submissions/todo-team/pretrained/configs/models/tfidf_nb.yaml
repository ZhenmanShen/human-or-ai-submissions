# Naive Bayes family. variant: multinomial | complement | nbsvm
model:
  name: tfidf_nb
  params:
    variant: nbsvm
    alpha: 1.0     # Laplace/Lidstone smoothing
    C: 4.0         # only used by nbsvm
    tfidf:
      sublinear_tf: true
      lowercase: true
      word:
        ngram_range: [1, 3]
        min_df: 2
        max_features: 300000
      char: null
