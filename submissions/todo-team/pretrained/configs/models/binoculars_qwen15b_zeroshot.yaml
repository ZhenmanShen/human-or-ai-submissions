# Training-free reference: raw Binoculars score (no classifier). Shares the feature cache with
# binoculars_qwen15b, so it costs nothing extra once that has run.  [GPU | Mac: not recommended]
model:
  name: lm_perplexity
  params:
    lm_name: Qwen/Qwen2.5-1.5B
    performer_name: Qwen/Qwen2.5-1.5B-Instruct
    max_length: 512
    batch_size: 4
    head: zero_shot
    add_stylometric: false
