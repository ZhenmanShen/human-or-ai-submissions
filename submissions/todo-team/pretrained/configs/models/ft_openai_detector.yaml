# Fine-tune OpenAI's GPT-2-output detector (RoBERTa-base), as in Ma et al. (2023). [GPU | Mac: possible, ~40 min/epoch]
model:
  name: transformer
  params:
    model_name: openai-community/roberta-base-openai-detector
    max_length: 512
    batch_size: 16
    grad_accum: 2
    eval_batch_size: 128
    lr: 1.0e-5
    epochs: 3
    weight_decay: 0.01
    warmup_ratio: 0.1
    precision: auto              # bf16 on RTX 30/40/50, fp32 on Mac
    gradient_checkpointing: false
    keep_best_epoch: false       # fixed epochs keep OOF scores honest

# Test predictions = average of the CV fold models (no extra refit).
final:
  strategy: fold_average
